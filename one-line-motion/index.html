<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Line Motion Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:28px}
main{max-width:850px;margin:auto}
header{padding:28px;background:#1c2b40;border-radius:18px}
h1{margin:0 0 10px;color:#9de4e7}
p{color:#b9c7d8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.card{background:#1c2b40;border:1px solid #34465e;border-radius:16px;padding:22px}
a{display:inline-block;margin-top:12px;padding:12px 18px;background:#28a9a5;color:#fff;text-decoration:none;border-radius:9px}
</style>
</head>
<body>
<main>
<header>
<h1>ONE LINE MOTION STUDIO</h1>
<p>Personal video creation workspace</p>
</header>
<section class="grid">
<div class="card"><h2>🎬 Shorts Studio</h2><p>Preview dan kelola video animasi Remotion.</p><a href="/studio">Buka Studio</a></div>
<div class="card"><h2>🎙️ Voice Studio</h2><p>AI narration dan rekaman suara sendiri.</p><a href="/voice">Buka Voice Studio</a></div>
</section>
</main>
</body>
</html>
